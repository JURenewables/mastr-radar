# Checks access to Netztransparenz and ENTSO-E with the repository secrets and
# prints only summaries (row counts, columns, top values). Never prints secrets.
name: Grid API probe

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - pipeline/src/mastr_radar/gridapis.py
      - .github/workflows/grid-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install pipeline
        working-directory: pipeline
        run: uv sync --python 3.12
      - name: Probe the grid APIs
        working-directory: pipeline
        env:
          NETZTRANSPARENZ_CLIENT_ID: ${{ secrets.NETZTRANSPARENZ_CLIENT_ID }}
          NETZTRANSPARENZ_CLIENT_SECRET: ${{ secrets.NETZTRANSPARENZ_CLIENT_SECRET }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: uv run mastr-radar grid-fetch --probe
