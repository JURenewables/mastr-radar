name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
