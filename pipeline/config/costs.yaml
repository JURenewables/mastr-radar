# Cost benchmarks (contract v1.11, WP90). Hand-checked from the cited
# publications; every value carries its source, edition, page, price basis and
# how it was read. "chart_read" values were read off a published chart and
# carry a tolerance. Page numbers are PDF pages. Station 3 (costs.py) converts and checks them.
as_of: "2026-08-26"   # newest edition used (DEA solar sheets)

# USD per EUR, ECB annual average reference rate.
fx_usd_per_eur: {2024: 1.0824}
# Danish net price index used by the DEA catalogue (note N of the solar sheets),
# to express DEA €2020 values in € of a later year.
deflator_dea: {2020: 0.856, 2021: 0.869, 2022: 0.935, 2023: 0.973, 2024: 0.982, 2025: 1.000, 2026: 1.020}

sources:
  windguard:
    title: "Deutsche WindGuard: Kostensituation der Windenergie an Land, Stand 2024 (for the Federal Ministry for Economic Affairs)"
    edition: "1 Oct 2024, corrected 2 Dec 2024"
    url: "https://www.bundeswirtschaftsministerium.de/Redaktion/DE/Downloads/Energie/eeg-eb-wal-kostensituation-2024.pdf?__blob=publicationFile&v=12"
    licence: "Figures cited with source"
    attribution: "Deutsche WindGuard (2024), Kostensituation der Windenergie an Land"
    scope: "Germany; survey of turbine makers and 72 projects (1,470 MW) commissioned 2024–2026"
  ise:
    title: "Fraunhofer ISE: Stromgestehungskosten erneuerbare Energien"
    edition: "July 2024 (trend: June 2021, March 2018)"
    url: "https://www.ise.fraunhofer.de/de/veroeffentlichungen/studien/studie-stromgestehungskosten-erneuerbare-energien.html"
    licence: "Figures cited with source"
    attribution: "Fraunhofer ISE, Stromgestehungskosten erneuerbare Energien (2024, 2021, 2018)"
    scope: "Germany; low and high values for current plants, excluding VAT"
  dea:
    title: "Danish Energy Agency: Technology Data for Generation of Electricity and District Heating"
    edition: "Onshore wind sheet Feb 2024 (€2020); solar PV sheets Aug 2026 (€2025)"
    url: "https://ens.dk/en/analyses-and-statistics/technology-data-generation-electricity-and-district-heating"
    licence: "CC BY 4.0"
    attribution: "Danish Energy Agency, Technology Data (CC BY 4.0)"
    scope: "Denmark; central estimate with component breakdown and projections to 2050"
  irena:
    title: "IRENA: Renewable Power Generation Costs in 2024"
    edition: "July 2025"
    url: "https://www.irena.org/Publications/2025/Jun/Renewable-Power-Generation-Costs-in-2024"
    licence: "Free use with acknowledgement of IRENA as source and copyright holder"
    attribution: "IRENA (2025), Renewable Power Generation Costs in 2024"
    scope: "Germany from country charts (approx.), Europe from tables; 2024 USD"

wind_onshore:
  lead: windguard
  lead_note: "German survey data, the reference used by the ministry. The Danish catalogue is shown for comparison: its onshore sheet reflects Danish rules (grid paid by the public, neighbour buy-outs, land purchase) and 2020 prices."
  capex_breakdown:
    source: windguard
    period: "commissioning 2024–2026"
    unit: "€/kW"
    price_basis: {kind: nominal, year: 2024, currency: EUR}
    groups:
      - name: "Turbine, foundation, transport and installation"
        total: 1235
        method: chart_read
        tolerance: 20
        page: 17
        note: "Average configuration of 2024 (Figure 6); split by the average shares reported by manufacturers (p. 11): turbine 74 %, foundation 7 %, transport and installation 19 %."
        components:
          - {name: "Turbine (rotor, nacelle, tower)", share: 74}
          - {name: "Foundation", share: 7}
          - {name: "Transport and installation", share: 19}
      - name: "Ancillary investment"
        total: 506
        method: text
        page: 18
        note: "Planning, grid connection up to the substation, roads and crane pads, nature compensation, other (72 projects, 1,470 MW)."
        components:
          - {name: "Planning and permitting", value: 204}
          - {name: "Grid connection", value: 116}
          - {name: "Roads and site", value: 101}
          - {name: "Other", value: 67}
          - {name: "Nature compensation", value: 18}
  capex_breakdown_alt:
    source: dea
    period: "2025 central estimate"
    unit: "€/kW"
    price_basis: {kind: real, year: 2020, currency: EUR}
    total: 1185
    method: table
    note: "Danish context: grid connection beyond the park is paid by the public; neighbour buy-outs, land purchase and removal of old turbines are included."
    components:
      - {name: "Turbine and equipment", value: 864}
      - {name: "Installation and development", value: 90}
      - {name: "Grid connection (park only)", value: 17}
      - {name: "Land purchase or rent (capitalised)", value: 111}
      - {name: "Neighbour buy-outs", value: 70}
      - {name: "Removal of old turbines", value: 32}
  opex_breakdown:
    source: windguard
    unit: "€/kW/yr"
    price_basis: {kind: nominal, year: 2024, currency: EUR}
    method: chart_read
    tolerance: 0.5
    page: 25
    note: "Average annual operating costs for projects commissioned 2024–2026, first and second decade of operation (58 projects, 1,213 MW)."
    totals: {decade_1: 49, decade_2: 57}
    components:
      - {name: "Land lease", decade_1: 18, decade_2: 19}
      - {name: "Maintenance and repair", decade_1: 13, decade_2: 17}
      - {name: "Other", decade_1: 6, decade_2: 7}
      - {name: "Operations and management", decade_1: 4, decade_2: 5}
      - {name: "Direct marketing", decade_1: 3, decade_2: 4}
      - {name: "Decommissioning reserve", decade_1: 3, decade_2: 4}
      - {name: "Insurance", decade_1: 1, decade_2: 1}
  capex_compare:
    - {source: windguard, label: "WindGuard, total", year: 2024, value: 1741, unit: "€/kW", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: text, note: "Main investment (approx. 1,235) plus ancillary investment (506)."}
    - {source: windguard, label: "WindGuard, turbine incl. foundation", year: 2024, value: 1235, unit: "€/kW", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: chart_read, tolerance: 20}
    - {source: ise, label: "Fraunhofer ISE", year: 2024, low: 1300, high: 1900, unit: "€/kW", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: table, page: 14}
    - {source: dea, label: "Danish Energy Agency, total", year: 2025, value: 1185, unit: "€/kW", price_basis: {kind: real, year: 2020, currency: EUR}, method: table, convert_to: 2024}
    - {source: dea, label: "Danish Energy Agency, core items", year: 2025, value: 971, unit: "€/kW", price_basis: {kind: real, year: 2020, currency: EUR}, method: table, convert_to: 2024, note: "Turbine, installation and park grid only."}
    - {source: irena, label: "IRENA, Germany", year: 2024, value: 1670, unit: "USD/kW", price_basis: {kind: real, year: 2024, currency: USD}, method: chart_read, tolerance: 100, page: 70}
    - {source: irena, label: "IRENA, Europe", year: 2024, value: 1659, low: 1211, high: 2232, unit: "USD/kW", price_basis: {kind: real, year: 2024, currency: USD}, method: table, page: 71, note: "Weighted average, 5th to 95th percentile."}
  opex_compare:
    - {source: windguard, label: "WindGuard, years 1–10", year: 2024, value: 49, unit: "€/kW/yr", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: text, page: 25}
    - {source: windguard, label: "WindGuard, years 11–20", year: 2024, value: 57, unit: "€/kW/yr", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: text, page: 25}
    - {source: ise, label: "Fraunhofer ISE", year: 2024, value: 32, variable_eur_mwh: 7, unit: "€/kW/yr", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: table, page: 16, note: "Fixed 32 €/kW/yr plus 7 €/MWh variable."}
    - {source: dea, label: "Danish Energy Agency", year: 2025, value: 17.4, variable_eur_mwh: 2.06, unit: "€/kW/yr", price_basis: {kind: real, year: 2020, currency: EUR}, method: table, convert_to: 2024, note: "Excludes land lease, which DEA counts in the investment."}
    - {source: irena, label: "IRENA, Germany", year: 2024, value: 49, unit: "USD/kW/yr", price_basis: {kind: real, year: 2024, currency: USD}, method: text, page: 80}
  # Full-load hours used only to add variable opex to fixed opex for the comparison chart.
  compare_full_load_hours: 2500
  capex_trend:
    - source: windguard
      label: "WindGuard: turbine incl. foundation, average configuration"
      unit: "€/kW"
      price_basis: {kind: nominal, currency: EUR}
      method: chart_read
      tolerance: 20
      page: 17
      note: "Survey years; 2023 = survey in Q4 2022. Excludes ancillary investment."
      points: [[2015, 1215], [2016, 1195], [2017, 1195], [2018, 1085], [2020, 995], [2021, 1025], [2022, 1120], [2023, 1200], [2024, 1235]]
    - source: ise
      label: "Fraunhofer ISE: plant cost range"
      unit: "€/kW"
      price_basis: {kind: nominal, currency: EUR}
      method: table
      ranges: [[2018, 1500, 2000], [2021, 1400, 2000], [2024, 1300, 1900]]
    - source: irena
      label: "IRENA: Germany, weighted average (2010 and 2024 only)"
      unit: "USD/kW"
      price_basis: {kind: real, year: 2024, currency: USD}
      method: chart_read
      tolerance: 100
      page: 70
      note: "Fell 38 % from 2010 to 2024."
      points: [[2010, 2700], [2024, 1670]]
  projections:
    source: dea
    unit: "€/kW"
    price_basis: {kind: real, year: 2020, currency: EUR}
    central: [[2020, 1106], [2025, 1185], [2030, 1147], [2040, 1110], [2050, 1090]]
    range: [[2020, 872, 1308], [2050, 796, 1193]]
  lcoe:
    - {source: ise, label: "Fraunhofer ISE: cost of electricity, new plants 2024", low: 4.3, high: 9.2, unit: "ct/kWh", year: 2024}

solar:
  lead: dea
  lead_note: "The Danish catalogue has the most detailed and newest breakdown (August 2026, open licence). It reflects Danish prices, which are lower than the German range from Fraunhofer ISE; both are shown."
  capex_breakdown:
    source: dea
    segment: "Ground-mounted (utility-scale)"
    period: "2025 central estimate"
    unit: "€/kWp"
    price_basis: {kind: real, year: 2025, currency: EUR}
    total: 458
    method: table
    note: "Per kWp of module capacity (DC). Connection fees to the grid operator are not included."
    components:
      - {name: "Mounting, cabling and other hardware", value: 128}
      - {name: "PV modules", value: 120}
      - {name: "Installation work", value: 104}
      - {name: "Transformer and grid connection", value: 46}
      - {name: "Permits, studies and planning", value: 40}
      - {name: "Inverters", value: 20}
  opex_breakdown:
    source: dea
    segment: "Ground-mounted (utility-scale)"
    unit: "€/kWp/yr"
    price_basis: {kind: real, year: 2025, currency: EUR}
    method: table
    note: "Includes insurance and inverter replacement."
    total: 7.72
    components:
      - {name: "Operation, maintenance, insurance, inverter replacement", value: 5.38}
      - {name: "Land lease", value: 2.34}
  segments:
    - {segment: "Ground-mounted", source: dea, capex: 458, opex: 7.72, unit: "€/kWp", price_basis: {kind: real, year: 2025, currency: EUR}}
    - {segment: "Commercial rooftop", source: dea, capex: 637, opex: 2.19, unit: "€/kWp", price_basis: {kind: real, year: 2025, currency: EUR}}
    - {segment: "Home rooftop", source: dea, capex: 905, opex: 4.56, unit: "€/kWp", price_basis: {kind: real, year: 2025, currency: EUR}}
    - {segment: "Ground-mounted", source: ise, low: 700, high: 900, opex: 13.3, unit: "€/kWp", price_basis: {kind: nominal, year: 2024, currency: EUR}}
    - {segment: "Agri-PV", source: ise, low: 900, high: 1700, opex: 15, unit: "€/kWp", price_basis: {kind: nominal, year: 2024, currency: EUR}}
    - {segment: "Commercial rooftop", source: ise, low: 900, high: 1600, opex: 21.5, unit: "€/kWp", price_basis: {kind: nominal, year: 2024, currency: EUR}}
    - {segment: "Home rooftop", source: ise, low: 1000, high: 2000, opex: 26, unit: "€/kWp", price_basis: {kind: nominal, year: 2024, currency: EUR}}
  capex_compare:
    - {source: dea, label: "Danish Energy Agency", year: 2025, value: 458, low: 389, high: 573, unit: "€/kWp", price_basis: {kind: real, year: 2025, currency: EUR}, method: table, note: "Central estimate with uncertainty range."}
    - {source: ise, label: "Fraunhofer ISE", year: 2024, low: 700, high: 900, unit: "€/kWp", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: table, page: 14}
    - {source: irena, label: "IRENA, Germany", year: 2024, value: 570, unit: "USD/kW", price_basis: {kind: real, year: 2024, currency: USD}, method: chart_read, tolerance: 75, page: 94, note: "Read from the country chart; fell 87 % since 2010."}
    - {source: irena, label: "IRENA, Europe", year: 2024, value: 779, low: 524, high: 1312, unit: "USD/kW", price_basis: {kind: real, year: 2024, currency: USD}, method: table, page: 95, note: "Weighted average, 5th to 95th percentile."}
  opex_compare:
    - {source: dea, label: "Danish Energy Agency", year: 2025, value: 7.72, unit: "€/kWp/yr", price_basis: {kind: real, year: 2025, currency: EUR}, method: table}
    - {source: ise, label: "Fraunhofer ISE", year: 2024, value: 13.3, unit: "€/kWp/yr", price_basis: {kind: nominal, year: 2024, currency: EUR}, method: table, page: 16}
  capex_trend:
    - source: ise
      label: "Fraunhofer ISE: ground-mounted, range"
      unit: "€/kWp"
      price_basis: {kind: nominal, currency: EUR}
      method: table
      ranges: [[2018, 600, 800], [2021, 530, 800], [2024, 700, 900]]
    - source: irena
      label: "IRENA: Germany, utility-scale, weighted average (2010 and 2024 only)"
      unit: "USD/kW"
      price_basis: {kind: real, year: 2024, currency: USD}
      method: chart_read
      tolerance: 250
      page: 94
      points: [[2010, 4400], [2024, 570]]
  projections:
    source: dea
    unit: "€/kWp"
    price_basis: {kind: real, year: 2025, currency: EUR}
    central: [[2025, 458], [2030, 428], [2035, 402], [2040, 381], [2050, 355]]
    range: [[2025, 389, 573], [2050, 301, 461]]
  lcoe:
    - {source: ise, label: "Fraunhofer ISE: cost of electricity, new ground-mounted plants 2024", low: 4.1, high: 6.9, unit: "ct/kWh", year: 2024}
