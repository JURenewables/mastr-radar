# Paths are relative to the repository root.
data_dir: data               # downloads and working files (git-ignored)
output_dir: web/public/data  # files the website reads

# Operator names are only shown for units at or above this size.
min_capacity_mw: 1.0

# Technologies in the explorer (contract D9).
technologies:
  - wind_onshore
  - wind_offshore
  - solar
  - storage
  - biomass
  - hydro

# Station 1: download of the BNetzA bulk export ("Gesamtdatenexport").
download:
  page_url: https://www.marktstammdatenregister.de/MaStR/Datendownload
  max_attempts: 10          # resume attempts before giving up
  backoff_seconds: 5        # first wait; doubles each attempt, capped at 300 s
  timeout_seconds: 120      # per network read
  max_age_days: 3           # check: export must be at most this old
  min_size_bytes: 1500000000  # check: export must be at least 1.5 GB
  # Check: at least one file must match each pattern (contract v1.1).
  required_files:
    - EinheitenWind*.xml
    - EinheitenSolar_*.xml
    - EinheitenStromSpeicher_*.xml
    - AnlagenStromSpeicher_*.xml
    - EinheitenBiomasse*.xml
    - EinheitenWasser*.xml
    - Marktakteure_*.xml
    - Katalogwerte.xml

# Station 3 cross-check against Fraunhofer ISE Energy-Charts (warning only).
crosscheck:
  url: https://api.energy-charts.info/installed_power?country=de&time_step=monthly&installation_decommission=false
  timeout_seconds: 30
  tolerance_pct: 2.0
  # Our technology → Energy-Charts production type. MaStR gross solar capacity
  # is module (DC) power. Storage is not compared yet: ours includes pumped hydro.
  series:
    wind_onshore: Wind onshore
    wind_offshore: Wind offshore
    solar: Solar DC
    biomass: Biomass

# Station 3 monitor files (contract v1.3).
monitor:
  first_year: 1990
  # Legal 2030 targets in MW: EEG 2023 §4 (solar, onshore wind) and WindSeeG §1 (offshore).
  targets_2030_mw:
    solar: 215000
    wind_onshore: 115000
    wind_offshore: 30000
  point_min_kw: 1000        # plants on the animated map
  repowering_age_years: 20  # onshore turbines older than this count as repowering candidates

# Data hub (contract v1.4 draft): SMARD market data, CC BY 4.0,
# attribution "Bundesnetzagentur | SMARD.de". Values are MWh per quarter hour.
hub:
  keep_days: 365
  smard:
    base_url: https://www.smard.de/app/chart_data
    regions: [DE, 50Hertz, Amprion, TenneT, TransnetBW]
    # Nuclear (1224) left out: no German plant has run since 15 Apr 2023 and
    # SMARD sends no values.
    generation:            # our name: SMARD filter id
      solar: 4068
      wind_onshore: 4067
      wind_offshore: 1225
      biomass: 4066
      hydro: 1226
      other_renewable: 1228
      lignite: 1223
      hard_coal: 4069
      gas: 4071
      pumped_storage: 4070
      other_conventional: 1227
    demand: 410            # Netzlast
    residual_load: 4359
