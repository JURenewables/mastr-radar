  - {group: HessenEnergie, category: municipal, match: "^hessenenergie"}
  - {group: SWM (Stadtwerke München), category: municipal, match: "stadtwerke münchen|\\bswm\\b"}
  - {group: Stadtwerke (other), category: municipal, bucket: true, match: "stadtwerk|gemeindewerk|stadtwerke|energieversorgung|\\bswb\\b|kommunal|versorgungsbetriebe"}

  # --- Citizen & local ---
  - {group: Citizen wind farms, category: citizen, bucket: true, match: "bürger|buerger"}
  - {group: Cooperatives, category: citizen, bucket: true, match: "genossenschaft|\\beg$|\\beg\\b(?!br)"}
  - {group: Raiffeisen & farmers, category: citizen, bucket: true, match: "raiffeisen|landvolk|landwirt"}
  - {group: Partnerships (GbR), category: citizen, bucket: true, match: "\\bgbr\\b|\\begbr\\b"}

other: Not attributed

# Names that do not end in a legal form of a company are treated as possible
# natural persons (privacy rule D4): counted, never shown by name.
legal_entity: "\\b(gmbh|kg|ag|se|mbh|ug|eg|kgaa|b\\.v\\.|a/s|s\\.a\\.|ltd|limited|e\\.v\\.|aps|sarl|s\\.à r\\.l\\.)\\b"
