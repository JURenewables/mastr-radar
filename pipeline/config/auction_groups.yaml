# Auction bidders → company groups (contract v1.6 draft).
#
# Award lists name the bidding company, often a project company ("wpd Windpark
# Nr. 440 GmbH & Co. KG"). A bidder belongs to a group when its name matches the
# group's regular expression (lower case, first match wins, so specific groups
# come first). Project companies without a group name stay "not attributed":
# their parent cannot be told from the name alone.
#
# Groups marked `bucket` collect many independent companies (e.g. all
# citizen wind farms): they count in the category totals but are not ranked
# as winners.
#
# Categories:
#   developer: independent developers and power producers (IPPs)
#   utility:   large and regional energy utilities (RWE, EnBW, Vattenfall, Uniper, E.ON, …)
#   municipal: municipal utilities (Stadtwerke) and their associations (e.g. Trianel, Thüga)
#   citizen:   citizen wind farms, cooperatives, farmers' and local companies
categories:
  developer: Developers & IPPs
  utility: Utilities
  municipal: Stadtwerke & municipal
  citizen: Citizen & local
  unattributed: Not attributed

groups:
  # --- Developers & IPPs ---
  # Alterric (EWE / Aloys Wobben Stiftung joint venture) develops and finances
  # projects like an IPP, so it counts here.
  - {group: Alterric, category: developer, match: "alterric"}
  - {group: wpd, category: developer, match: "\\bwpd\\b"}
  # UKA bids through project companies named "UGE … GmbH & Co. KG Umweltgerechte
  # Energie" (registered in Lohmen / Amtsgericht Rostock like UKA; UKA is the
  # applicant or builder at UGE award sites such as Papenburg and Schäcksdorf).
