  scope: "Installations outside China"
  makers:
    - {maker: Vestas, gw: 12.9, countries: 36}
    - {maker: Nordex, gw: 7.7, countries: 24}
    - {maker: GE Vernova, gw: 5.8}
    - {maker: Siemens Gamesa, gw: 5.4, countries: 21}
    - {maker: Envision, gw: 4.2}
  notes:
    - "Enercon installed in 22 countries in 2025."
    - "Nordex: about 32 % of new onshore capacity in Germany in 2025 (1,647 MW)."
  sources:
    - https://www.gwec.net/news/gwec-records-sharp-rise-in-wind-turbine-installations-as-five-oems-exceed-100-gw
