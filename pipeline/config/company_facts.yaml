    - https://app.boersengefluester.de/en/newswire/DE000A0D6554/nordex-se/in-2025-the-nordex-group-accounted-for-approx-32-of-new-onshore-wind-turbine-installations-mw-in-germany-2260694

# Market context for the "overheating" sections. Submitted bids are only in
# BNetzA press releases (the round pages give awarded volumes only).
market:
  oversubscription:
    - {tech: wind, bid_date: "2026-02-01", tender_mw: 3445, submitted_mw: 7858, bids: 924, source: "https://www.bundesnetzagentur.de/SharedDocs/Pressemitteilungen/DE/2026/20260331_EE_AusschreibungWind.html"}
    - {tech: wind, bid_date: "2026-05-01", tender_mw: 2495, submitted_mw: 6409, bids: 628, source: "https://www.solarserver.de/2026/06/26/mai-ausschreibung-fuer-windenergieanlagen-an-land-deutlich-ueberzeichnet/"}
    - {tech: wind, bid_date: "2026-08-01", tender_mw: 2520, submitted_mw: 5250, bids: 461, source: "https://www.bundesnetzagentur.de/SharedDocs/Pressemitteilungen/DE/2026/20260917_Wind.html"}
    - {tech: solar, bid_date: "2026-03-01", tender_mw: 2295, submitted_mw: 4622, source: "https://www.iwr.de/news/wettbewerb-bleibt-hoch-ausschreibung-fuer-pv-freiflaechenanlagen-zum-01-maerz-2026-wieder-deutlich-ueberzeichnet-news39683"}
    - {tech: solar, bid_date: "2026-07-01", tender_mw: 2135, submitted_mw: 3170, bids: 401, source: "https://www.bundesnetzagentur.de/SharedDocs/Pressemitteilungen/DE/2026/20260818_Solar1.html"}
  facts:
    - tech: wind
      text: "The Aug 2026 round was the ninth oversubscribed onshore wind round in a row."
      source: https://www.bdew.de/energie/ergebnisse-der-augustausschreibung-fuer-windenergieanlagen-an-land-2026/
    - tech: wind
      text: "In May 2026 Bavaria won only 4 awards and Baden-Württemberg 8; the wind industry association says enough permitted projects exist."
      source: https://www.solarserver.de/2026/06/26/mai-ausschreibung-fuer-windenergieanlagen-an-land-deutlich-ueberzeichnet/
    - tech: wind
      text: "An onshore wind award lapses 36 months after it is published if the turbines are not running; from 30 months, late commissioning costs 10–30 €/kW, and a lapsed award costs 30 €/kW."
      source: https://www.buzer.de/55_EEG_2023.htm
    - tech: solar
      text: "Solar's market value fell from about 98 % of the average power price in 2022 to about 54 % in 2025 so far, as measured mid-year (capture rate)."
      source: https://modoenergy.com/research/en/germany-2025-solar-cannibalisation-glut-subsidies-power-prices-bess
    - tech: solar
      text: "In April 2026 Germany had 123 hours of negative prices (75 a year earlier); 47 % of solar output fell into negative-price hours."
      source: https://www.pv-magazine.com/2026/05/13/solar-capture-factors-fall-across-europe-as-negative-price-hours-surge-in-key-markets/
    - tech: solar
      text: "A lapsed ground-mounted solar award costs a penalty of 50 €/kW."
      source: https://www.buzer.de/55_EEG_2023.htm
