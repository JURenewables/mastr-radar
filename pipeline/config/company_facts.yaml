# Hand-checked company facts shown next to the auction analysis (contract v1.7 draft).
# Every entry needs at least one source URL. Only state what a source says; leave a
# field out when no source supports it. `group` must match a group name in
# auction_groups.yaml so the website can join it to the auction figures.
#
# model:   develop_sell = develops and sells parks to investors
#          ipp          = develops and keeps parks (independent power producer)
#          mixed        = keeps part, sells part
#          investor     = fund-backed platform that buys projects and develops them
# finance: project / corporate / fund / mixed (as reported in the source)

as_of: "2026-11-01"

companies:
  - group: UKA
    model: develop_sell
    finance: null
    international: true
    note: >-
      Plans, builds and hands over wind and solar parks to funds, energy suppliers,
      Stadtwerke and infrastructure investors; a sister company runs them afterwards.
      Owner-managed.
    sources:
      - https://www.uka-gruppe.de/en/
  - group: wpd
    model: mixed
    finance: mixed
    international: true
    note: >-
      Develops, finances, builds and operates wind and solar parks; keeps a large own
      portfolio and sells single parks and portfolios to investors. Uses project
      finance and has also raised corporate debt (promissory note loan).
    sources:
      - https://www.wpd.de/en
      - https://www.offshorewind.biz/?p=158136
  - group: Alterric
    model: ipp
    finance: corporate
    international: true
    note: >-
      50/50 joint venture of the Aloys Wobben Stiftung (owner of Enercon) and EWE,
      since 2021. Keeps its parks: more than 2.5 GW in its own portfolio in Germany,
      France and Greece; target up to 5 GW by 2030. Unsecured corporate credit
      facility raised to €350m (Dec 2025).
    sources:
      - https://www.alterric.com/en/pressemitteilung/aws-and-ewe-establish-joint-venture-for-project-management-and-operation/
      - https://www.cleanenergywire.org/news/new-german-company-aims-achieve-5-gw-onshore-wind-2030
  - group: Qualitas Energy
    model: investor
    finance: fund
    international: true
    note: >-
      Investment platform backed by its Q-Energy funds. Grew in Germany by buying
      developers and pipelines: DunoAir's business (2023), a 250 MW portfolio
      (Jan 2025), several repowering pipelines (2025) and 91 MW from PNE (Jan 2026).
    sources:
      - https://www.nsenergybusiness.com/news/qualitas-energy-acquires-dunoairs-1-4gw-german-onshore-wind-development-business/
      - https://qualitasenergy.com/wp-content/uploads/250128_PR_Qualitas-Energy-acquires-250-MW-wind-energy-portfolio-in-Germany.pdf
      - https://www.energyglobal.com/wind/08012026/qualitas-energy-acquires-wind-energy-portfolio-from-pne-ag/
  - group: Enerparc
    model: ipp
    finance: project
    international: true
    note: >-
      One of Germany's largest solar IPPs (about 3.8 GW in operation, 1.5 GW under
      construction). Financed with project-finance frameworks (e.g. €216m senior
      secured from LBBW, Mar 2025) and mezzanine debt. Filed for insolvency in
      Sept 2026 after a key financing for solar-plus-storage projects failed;
      parks keep running, an asset sale is under way.
    sources:
      - https://pv-tech.org/enerparc-secures-financing-for-400mw-german-solar-pv-portfolio
      - https://taiyangnews.info/business/enerparc-files-for-insolvency
      - https://www.pv-magazine.com/2026/10/05/enerparc-attracts-more-than-100-potential-investors-as-insolvency-sale-moves-forward/
  - group: ABO Energy
    model: develop_sell
    finance: mixed
    international: true
    note: >-
      Develops and sells wind, solar and storage projects in many countries.
      Expected a 2025 loss of about €170m, its first; lost half its share
      capital (Jul 2026). Out-of-court restructuring, not insolvency: banks
      agreed a standstill in Jan 2026, extended to 30 Nov 2026 while a
      restructuring financing is negotiated (Rothschild advises the lenders).
      Keeps bidding and sells projects; plans to become a power producer.
    sources:
      - https://www.aboenergy.com/en/media-center/press/2026/2026-01-26_standstill-agreement-press-release.html
      - https://www.deraktionaer.de/nachricht/eqs-news-abo-energy-erreicht-meilensteine-auf-dem-sanierungspfad-und-definiert-handlungsfelder-fuer-eine-erfolgreiche-neuausrichtung-deutsch-524299.html
      - https://www.4investors.de/nachrichten/boerse.php?sektion=stock&ID=191334
  - group: BayWa r.e.
    model: mixed
    finance: mixed
    international: true
    note: >-
      Restructuring since the parent BayWa's 2024 crisis: a planned stake sale to
      EIP fell through; the company refocuses on development plus its own power
      portfolio and has left Asia-Pacific.
    sources:
      - https://taiyangnews.info/business/baywa-eip-deal-falls-through
      - https://us.baywa-re.com/en/news/baywa-r-e-sharpens-profile

# Retreats, crises and exits. kind: insolvency / restructuring / sales_halt / exit
events:
  - company: Senvion
    group: null
    date: "2019-04"
    kind: insolvency
    tech: wind
    issue: >-
      Turbine maker (formerly REpower) filed for insolvency, citing equipment
      prices under pressure from auctions. Its European service fleet was sold
      to Siemens Gamesa (Oct 2019) and turbine making in Europe ended.
    sources:
      - https://en.wikipedia.org/wiki/Senvion
  - company: Siemens Gamesa
    group: null
    date: "2023-06"
    kind: sales_halt
    tech: wind
    issue: >-
      Quality problems with the 4.X and 5.X onshore platforms; sales were
      restricted in 2023 and restarted in Europe from late 2024.
    sources:
      - https://mercomindia.com/quality-issues-losses-siemens-gamesa
      - https://power-technology.com/newsletters/siemens-gamesa-to-restart-european-sales-next-month
  - company: BayWa r.e.
    group: BayWa r.e.
    date: "2024-07"
    kind: restructuring
    tech: both
    issue: >-
      Parent BayWa's debt crisis; stake sale to EIP failed; asset sales and
      retreat from Asia-Pacific.
    sources:
      - https://taiyangnews.info/business/baywa-eip-deal-falls-through
      - https://us.baywa-re.com/en/news/baywa-r-e-sharpens-profile
  - company: ABO Energy
    group: ABO Energy
    date: "2026-01"
    kind: restructuring
    tech: both
    issue: >-
      Expected 2025 loss of about €170m; standstill agreement with banks and
      bondholders, extended to 30 Nov 2026; restructuring officer appointed.
      Not an insolvency filing so far.
    sources:
      - https://www.aboenergy.com/en/media-center/press/2026/2026-01-26_standstill-agreement-press-release.html
      - https://www.4investors.de/nachrichten/boerse.php?sektion=stock&ID=191334
  - company: SoWiTec
    group: null
    date: "2026-07"
    kind: insolvency
    tech: wind
    issue: >-
      Illiquidity and over-indebtedness. The CEO cited oversubscribed onshore
      tenders that pushed prices down, with most awards going to the north and
      squeezing margins of southern German projects.
    sources:
      - https://www.pv-tech.org/sowitec-announces-insolvency-due-to-excessive-debt/
  - company: Enerparc
    group: Enerparc
    date: "2026-09"
    kind: insolvency
    tech: solar
    issue: >-
      Filed at Hamburg court after a key financing for solar-plus-storage
      projects failed, about six months after a €1bn financing package;
      reported debt about €3bn. Parks keep running; asset sale with more than
      100 interested investors.
    sources:
      - https://taiyangnews.info/business/enerparc-files-for-insolvency
      - https://www.pv-magazine.com/2026/10/05/enerparc-attracts-more-than-100-potential-investors-as-insolvency-sale-moves-forward/
      - https://globalrestructuringreview.com/article/germanys-enerparc-joins-growing-list-of-renewable-energy-insolvencies
      - https://inspenet.com/en/news/enerparc-declares-insolvency-after-receiving-e1-billion/

# Turbine makers worldwide: GWEC, installations outside China in 2025 (GW) and the
# number of countries with installations. Germany share from Nordex.
