# Reviewed auction attributions and company-reported totals (contract v1.6 draft).
#
# Edit by hand. Every entry needs a public source. See docs/auction-crosscheck.md.
#
# assignments: awards whose bidder name does not reveal the company group, but
# a public source names the project. They override the name rules in
# auction_groups.yaml. `bidder` is the exact name in the award list. With
# `round` (and optionally `award_nos`) only those awards are assigned; without,
# every award of that bidder (use only for single-project companies).
assignments:
  - bidder: "AEZ Planungs GmbH & Co. KG"
    round: GT01052026
    award_nos: [WIN26-2/088, WIN26-2/089]
    group: Alterric
    evidence: "Alterric names Osterfeld among its six May 2026 awards; Alterric 177.3 + Osterfeld 64.8 = 242.1 MW, as announced (242 MW)."
    source: https://www.power-technology.com/news/alterric-secures-242mw-six-projects/
  - bidder: "Windpark GmbH & Co. Bornheim KG"
    round: GT1022025
    group: Alterric
    evidence: "Alterric lists Bornheim-Sechtem among its seven Feb 2025 awards (developed with partners); the awards are in Gemarkung Sechtem."
    source: https://www.windtech-international.com/projects-and-contracts/alterric-awarded-contracts-for-178-66-mw-in-german-onshore-wind-auction
  - bidder: "Windpark Rastede GmbH & Co.KG"
    round: GT1022025
    group: Alterric
    evidence: "Alterric lists Rastede-Liethe among its seven Feb 2025 awards (developed with partners)."
    source: https://www.windtech-international.com/projects-and-contracts/alterric-awarded-contracts-for-178-66-mw-in-german-onshore-wind-auction
  - bidder: "Gewi Windpark GmbH & Co. 17. Beteiligung KG"
    round: GT1022025
    group: Alterric
    evidence: "Alterric lists Lichterfelde among its seven Feb 2025 awards (developed with partners); the award is in Gemarkung Lichterfelde."
    source: https://www.windtech-international.com/projects-and-contracts/alterric-awarded-contracts-for-178-66-mw-in-german-onshore-wind-auction
  - bidder: "Windpark Sassenberg-Gröblingen GmbH"
    group: Qualitas Energy
    evidence: "Qualitas names Sassenberg-Gröblingen (4 × 5.56 MW) as one of its two Aug 2025 awards; with QE Windpark Ingstetten this gives 43.8 MW, as announced."
    source: https://www.renewable-energy-industry.com/news/press-releases/pm-8630-qualitas-energy-secures-43-mw-in-latest-onshore-wind-energy-tender

